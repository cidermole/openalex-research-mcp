services:
  openalex-mcp:
    build: .
    ports:
      - "${MCP_HTTP_PORT:-3100}:3100"
    environment:
      OPENALEX_EMAIL: ${OPENALEX_EMAIL:-}
      OPENALEX_API_KEY: ${OPENALEX_API_KEY:-}
      MCP_HTTP_PATH: ${MCP_HTTP_PATH:-/mcp}
      OPENALEX_DEBUG: ${OPENALEX_DEBUG:-}
      MCP_DEFAULT_PAGE_SIZE: ${MCP_DEFAULT_PAGE_SIZE:-}
    restart: unless-stopped
